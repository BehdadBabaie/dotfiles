[general]
live_config_reload = true
import = ["~/.config/alacritty/themes/themes/one_dark_custom.toml"]

[env]
TERM = "xterm-256color"

[window]
dynamic_padding = true

[window.padding]
x = 15

[font]
size = 12.0

[font.bold]
family = "UbuntuMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "UbuntuMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "UbuntuMono Nerd Font"
style = "Italic"

[font.normal]
family = "UbuntuMono Nerd Font"
style = "Regular"



